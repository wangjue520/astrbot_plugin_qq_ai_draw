name: astrbot_plugin_qq_ai_draw
display_name: 跑图姬（QQ AI 画图）
short_desc: 群里 @机器人"画一个佩丽卡"：AI 优化提示词 + 自动触发角色 LoRA，本地 Forge 出图发回群里
desc: |
  QQ 出图机器人插件：群里 @机器人 说「画 画面描述」，AI 把大白话优化成规范英文提示词、识别角色并自动触发对应 LoRA，调用你电脑上的本地 WebUI Forge 跑图，发回群里。

  ## 功能

  - **AI 提示词优化**：默认 xAI grok，可换任何 OpenAI 兼容 API
  - **角色字典**：内置 5000 条「中文名 → Danbooru tag」，说"画一个阿米娅"自动命中
  - **LoRA 自动触发**：扫描 LoRA 目录的 `.civitai.info`，命中训练词自动拼 `<lora:xxx:0.8>`
  - **画风与尺寸**：`画 厚涂 横 1080p 少女`，画风/横竖方/精准/模糊分辨率随意组合
  - **队列与配额**：多任务排队、每日配额、冷却、并发上限、黑名单
  - **网页手点优先**：Forge 网页里有人在跑图时，机器人自动排队不抢卡

  ## 使用

  群里 `@机器人 画 画面描述`；私聊直接发指令（不用 @）。

  | 指令 | 效果 |
  |---|---|
  | `画 一个少女` | AI 优化 + 自动触发 LoRA + 跑图 |
  | `画 厚涂 横 1080p 一个少女` | 画风 + 构图 + 模糊分辨率组合 |
  | `生图 英文tag` | 跳过优化，按原文直接跑 |
  | `再来` | 同提示词换种子重 roll |
  | `画风` / `帮助` | 画风列表 / 使用说明 |

  ## 前置条件

  1. 本地部署 WebUI Forge 并以 `--api` 启动（推荐 [forge-webui-launcher](https://github.com/wangjue520/forge-webui-launcher) 一键部署）
  2. 插件配置里填：Forge 地址、LoRA 目录、xAI API Key（可选，不填则跳过优化直接跑原文）

  灵感与核心逻辑来自 [QQ-AI-Draw-Bot](https://github.com/wangjue520/QQ-AI-Draw-Bot)。
