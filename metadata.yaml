  群里 @机器人 说「画一个佩丽卡」，AI 自动优化提示词、识别角色并自动触发对应 LoRA，调用本地 WebUI Forge 出图发回群里。内置 5000 条角色字典，支持画风预设、分辨率自由写法（精准/横竖方/1080p~4k）、队列配额。完整部署与使用教程见仓库 README。
